def mcVersionParts = project.minecraft_version.split('\\.')
def mcVersionNumber = (mcVersionParts[0] + mcVersionParts[1].padLeft(2, '0') + (mcVersionParts.size() > 2 ? mcVersionParts[2].padLeft(2, '0') : '00')).toInteger()
def unobfuscated = mcVersionNumber >= 260100

apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
apply plugin: 'com.replaymod.preprocess'
apply plugin: 'maven-publish'
apply plugin: 'com.gradleup.shadow'

def javaRelease = mcVersionNumber >= 260100 ? 25 : (mcVersionNumber >= 12100 ? 21 : (mcVersionNumber >= 12000 ? 17 : 16))
def defaultToolchainVersion = javaRelease >= 17 ? javaRelease : 17
def toolchainVersion = project.findProperty('java_toolchain_version')?.toInteger() ?: defaultToolchainVersion
def preprocessRootProject = rootProject.file("versions/mainProject").text.trim()
def poiVersion = '5.5.1'
def fabricPermissionsApiVersion = '0.3.1'
if (mcVersionNumber >= 260100) {
    fabricPermissionsApiVersion = '0.7.0'
} else if (mcVersionNumber >= 12111) {
    fabricPermissionsApiVersion = '0.6.1'
} else if (mcVersionNumber >= 12109) {
    fabricPermissionsApiVersion = '0.5.0'
} else if (mcVersionNumber >= 12106) {
    fabricPermissionsApiVersion = '0.4.0'
} else if (mcVersionNumber >= 12103) {
    fabricPermissionsApiVersion = '0.3.3'
} else if (mcVersionNumber >= 12102) {
    fabricPermissionsApiVersion = '0.3.2'
}

base {
    archivesName = project.archives_base_name + '-' + project.minecraft_version
}
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven {
        url = "https://maven.fabricmc.net/"
    }
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

configurations {
    shadowInclude
    testImplementation.extendsFrom = []
    testRuntimeOnly.extendsFrom = []
}

// For unobfuscated (mojmap) versions, use regular configurations instead of mod configurations

dependencies {
    def autoImpl = { Object... args -> unobfuscated ? implementation(*args) : modImplementation(*args) }

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (!unobfuscated) {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    }
    autoImpl "net.fabricmc:fabric-loader:${project.loader_version}"

    // Litematica and MaLiLib dependencies
    // Use Modrinth Maven if modrinth_litematica_version is defined, otherwise use CurseForge
    if (project.hasProperty('modrinth_litematica_version')) {
        autoImpl "maven.modrinth:litematica:${project.modrinth_litematica_version}"
        autoImpl "maven.modrinth:malilib:${project.modrinth_malilib_version}"
    } else {
        autoImpl "curse.maven:litematica-${project.litematica_minecraft_version}-308892:${project.litematica_fileid}"
        autoImpl "curse.maven:malilib-${project.litematica_minecraft_version}-303119:${project.malilib_fileid}"
    }

    autoImpl "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    include(autoImpl("me.lucko:fabric-permissions-api:${fabricPermissionsApiVersion}"))
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    if (mcVersionNumber >= 12000) {
        implementation "org.apache.logging.log4j:log4j-api:2.17.2"
        compileOnly "org.apache.logging.log4j:log4j-core:2.17.2"
        runtimeOnly "org.apache.logging.log4j:log4j-core:2.17.2"
    }

    implementation ("org.apache.poi:poi:${poiVersion}") {
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
    }
    shadowInclude ("org.apache.poi:poi:${poiVersion}") {
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
    }
    implementation ("org.apache.poi:poi-ooxml:${poiVersion}") {
        exclude group: "org.apache.poi", module: "ooxml-schemas"
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
    }
    shadowInclude ("org.apache.poi:poi-ooxml:${poiVersion}") {
        exclude group: "org.apache.poi", module: "ooxml-schemas"
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
    }
    implementation ("org.apache.poi:poi-ooxml-lite:${poiVersion}") {
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
    }
    shadowInclude ("org.apache.poi:poi-ooxml-lite:${poiVersion}") {
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    // Adjust mixin compatibility level and remove incompatible mixins for unobfuscated versions
    if (unobfuscated) {
        filesMatching(['syncmatica_r.mixin.json', 'syncmatica_r.litematica_mixin.json']) {
            filter { String line ->
                def result = line.replace('"JAVA_8"', '"JAVA_25"')
                if (result.contains('MixinWidgetSchematicPlacement')) {
                    return ''
                }
                return result
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {

    it.options.encoding = "UTF-8"

    if (JavaVersion.current().isJava9Compatible()) {
        it.options.release = javaRelease
    }

    // Suppress mixin annotation processor errors in dev environment
    it.options.compilerArgs += ['-Xlint:-processing']
}

sourceSets {
    test {
        if (project.name == preprocessRootProject) {
            java.srcDir rootProject.file("src/test/java")
        }
    }
}

tasks.named("test") {
    useJUnitPlatform()
    systemProperty "syncmatica.projectRoot", rootProject.projectDir.absolutePath
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(toolchainVersion)
    }
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)
}

loom {
    mixin {
        useLegacyMixinAp = false
        defaultRefmapName = "syncmatica_r.refmap.json"
    }
    if (unobfuscated) {
        mixin.defaultRefmapName = ''
    }
}

tasks.named("shadowJar") {
    archiveClassifier.set("")
    destinationDirectory = layout.buildDirectory.dir("tmp-shadow")
    configurations = [project.configurations.shadowInclude]
}

if (unobfuscated) {
    tasks.named("jar") {
        dependsOn tasks.named("shadowJar")
        from(zipTree(tasks.named("shadowJar").get().archiveFile))
        archiveClassifier.set("")
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
} else {
    tasks.named("remapJar") {
        dependsOn tasks.named("shadowJar")
        inputFile.set(tasks.named("shadowJar").get().archiveFile)
        archiveClassifier.set("")
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            if (unobfuscated) {
                artifact(jar) { builtBy jar }
            } else {
                artifact(remapJar) { builtBy remapJar }
            }
        }
    }

    repositories {

    }
}
