plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'com.replaymod.preprocess'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.0.0-beta4'
}

def mcVersionParts = project.minecraft_version.split('\\.')
def mcVersionNumber = (mcVersionParts[0] + mcVersionParts[1].padLeft(2, '0') + (mcVersionParts.size() > 2 ? mcVersionParts[2].padLeft(2, '0') : '00')).toInteger()
def javaRelease = mcVersionNumber >= 12100 ? 21 : (mcVersionNumber >= 12000 ? 17 : 16)
def toolchainVersion = javaRelease >= 17 ? javaRelease : 17

base {
    archivesName = project.archives_base_name + '-' + project.minecraft_version
}
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven {
        url = "https://maven.fabricmc.net/"
    }
    maven {
        url = "https://www.cursemaven.com"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

configurations {
    shadowInclude
}

dependencies {

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Litematica and MaLiLib dependencies
    // Use Modrinth Maven if modrinth_litematica_version is defined, otherwise use CurseForge
    if (project.hasProperty('modrinth_litematica_version')) {
        modImplementation "maven.modrinth:litematica:${project.modrinth_litematica_version}"
        modImplementation "maven.modrinth:malilib:${project.modrinth_malilib_version}"
    } else {
        modImplementation "curse.maven:litematica-${project.litematica_minecraft_version}-308892:${project.litematica_fileid}"
        modImplementation "curse.maven:malilib-${project.litematica_minecraft_version}-303119:${project.malilib_fileid}"
    }

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    if (mcVersionNumber >= 12000) {
        implementation "org.apache.logging.log4j:log4j-api:2.17.2"
        compileOnly "org.apache.logging.log4j:log4j-core:2.17.2"
        runtimeOnly "org.apache.logging.log4j:log4j-core:2.17.2"
    }

    implementation ("org.apache.poi:poi:5.2.5") {
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
    }
    shadowInclude ("org.apache.poi:poi:5.2.5") {
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
    }
    implementation ("org.apache.poi:poi-ooxml:5.2.5") {
        exclude group: "org.apache.poi", module: "ooxml-schemas"
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
    }
    shadowInclude ("org.apache.poi:poi-ooxml:5.2.5") {
        exclude group: "org.apache.poi", module: "ooxml-schemas"
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
    }
    implementation ("org.apache.poi:poi-ooxml-lite:5.2.5") {
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
    }
    shadowInclude ("org.apache.poi:poi-ooxml-lite:5.2.5") {
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {

    it.options.encoding = "UTF-8"

    if (JavaVersion.current().isJava9Compatible()) {
        it.options.release = javaRelease
    }

    // Suppress mixin annotation processor errors in dev environment
    it.options.compilerArgs += ['-Xlint:-processing']
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(toolchainVersion)
    }
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)
}

loom {
    mixin {
        useLegacyMixinAp = false
        defaultRefmapName = "syncmatica_r.refmap.json"
    }
}

tasks.named("shadowJar") {
    archiveClassifier.set("")
    destinationDirectory = layout.buildDirectory.dir("tmp-shadow")
    configurations = [project.configurations.shadowInclude]
}

tasks.named("remapJar") {
    dependsOn tasks.named("shadowJar")
    inputFile.set(tasks.named("shadowJar").get().archiveFile)
    archiveClassifier.set("")
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {

            artifact(remapJar) {
                builtBy remapJar
            }
        }
    }

    repositories {

    }
}
