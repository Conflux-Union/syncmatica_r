name: Issue Compliance Check

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  check-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure needs-info label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "needs-info" \
            --repo "${{ github.repository }}" \
            --color "FBCA04" \
            --description "Issue missing required information" \
            2>/dev/null || true

      - name: Check issue body against templates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BUG_FIELDS=("### Minecraft Version" "### Bug Description" "### Steps to Reproduce" "### Expected Behavior")
          FEATURE_FIELDS=("### Problem Description" "### Proposed Solution" "### Impact Scope")
          QUESTION_FIELDS=("### Your Question")

          check_fields() {
            local -n fields=$1
            for field in "${fields[@]}"; do
              if ! echo "$ISSUE_BODY" | grep -qF "$field"; then
                return 1
              fi
            done
            return 0
          }

          if check_fields BUG_FIELDS; then
            echo "Matches bug report template"
            exit 0
          fi

          if check_fields FEATURE_FIELDS; then
            echo "Matches feature request template"
            exit 0
          fi

          if check_fields QUESTION_FIELDS; then
            echo "Matches question template"
            exit 0
          fi

          echo "No template match found, adding needs-info label and comment"

          gh issue edit "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --add-label "needs-info"

          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "Hi! Your issue doesn't appear to use one of our templates. To help us address your issue faster, please close this and re-create it using an [issue template](https://github.com/${{ github.repository }}/issues/new/choose). Thanks!"
