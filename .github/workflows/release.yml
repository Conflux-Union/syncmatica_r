name: Release
on:
  release:
    types: [ published ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  Get-Versions:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.Get_Versions.outputs.versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get Minecraft versions
        id: Get_Versions
        run: |
          VERSIONS=$(find versions -maxdepth 1 -type d -name "[0-9]*.[0-9]*" | xargs -I {} basename {} | sort -V | jq -R . | jq -s -c .)
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
  Build-Matrix:
    runs-on: ubuntu-24.04
    needs: Get-Versions
    strategy:
      matrix:
        minecraft_version: ${{ fromJson(needs.Get-Versions.outputs.versions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.minecraft_version }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.minecraft_version }}-
            ${{ runner.os }}-gradle-
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build for ${{ matrix.minecraft_version }}
        run: ./gradlew :${{ matrix.minecraft_version }}:build
      - name: Stop Gradle daemon
        run: ./gradlew --stop
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.minecraft_version }}
          path: versions/${{ matrix.minecraft_version }}/build/libs/*.jar
          if-no-files-found: error
  Publish-Modrinth-Matrix:
    runs-on: ubuntu-24.04
    needs: [ Build-Matrix, Get-Versions ]
    strategy:
      matrix:
        minecraft_version: ${{ fromJson(needs.Get-Versions.outputs.versions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version metadata
        id: Version_Metadata
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
            if [ -z "$VERSION" ]; then
              VERSION="$TAG"
            fi
          else
            VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
            TAG="v$VERSION"
          fi
          echo "mod_version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Detect release channel
        id: Release_Channel
        run: |
          VERSION="${{ steps.Version_Metadata.outputs.mod_version }}"
          if [[ "$VERSION" == *"-pre-"* ]]; then
            TYPE="beta"
          else
            TYPE="release"
          fi
          echo "type=$TYPE" >> $GITHUB_OUTPUT
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.minecraft_version }}
          path: versions/${{ matrix.minecraft_version }}/build/libs/
      - name: Publish to Modrinth
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            versions/${{ matrix.minecraft_version }}/build/libs/*.jar
          name: ${{ format('{0} v{1} for MC {2}',
            'Syncmatica Revolution',
            steps.Version_Metadata.outputs.mod_version,
            matrix.minecraft_version) }}
          version: ${{ format('{0}-{1}-mc{2}',
            steps.Version_Metadata.outputs.tag,
            matrix.minecraft_version) }}
          version-type: ${{ steps.Release_Channel.outputs.type }}
          loaders: fabric
          game-versions: |
            ${{ matrix.minecraft_version }}
          dependencies: |-
            litematica(required)
  Github-Release:
    runs-on: ubuntu-24.04
    needs: [ Build-Matrix, Get-Versions ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Reorganize artifacts
        run: |
          mkdir -p release_files
          for version_dir in artifacts/build-*/; do
            cp "$version_dir"*.jar release_files/
          done
      - name: Upload to GitHub release
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          for jar_file in release_files/*.jar; do
            gh release upload "$TAG" "$jar_file" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch'
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          TAG="v$MOD_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git push --delete origin "$TAG" || true
            git tag -d "$TAG" || true
          fi
          gh release create "$TAG" release_files/*.jar --title "$TAG" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
