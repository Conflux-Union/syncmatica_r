name: Question
description: Ask a question about Syncmatica
labels: ["type/question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Version
      description: If relevant, which Minecraft version?
      placeholder: "e.g. 1.21.1"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any additional context that might help
    validations:
      required: false
