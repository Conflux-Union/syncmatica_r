name: Bug Report
description: Report a bug in Syncmatica
labels: ["type/bug"]
body:
  - type: dropdown
    id: minecraft-version
    attributes:
      label: Minecraft Version
      description: Which Minecraft version are you using?
      options:
        - "1.17.1"
        - "1.20.1"
        - "1.21.1"
        - "1.21.4"
        - "1.21.8"
        - "1.21.10"
        - "1.21.11"
    validations:
      required: true

  - type: input
    id: syncmatica-version
    attributes:
      label: Syncmatica Version
      description: Which Syncmatica version are you using? (e.g. 0.3.20)
      placeholder: "0.3.20"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where does this bug occur?
      options:
        - Client
        - Server
        - Both
    validations:
      required: true

  - type: input
    id: litematica-version
    attributes:
      label: Litematica / MaLiLib Version
      description: If relevant, provide Litematica and MaLiLib versions
      placeholder: "Litematica 0.18.x / MaLiLib 0.19.x"
    validations:
      required: false

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Crash Report
      description: Paste any relevant logs or crash reports
      render: text
    validations:
      required: false
