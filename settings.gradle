pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Jitpack'
            url = 'https://jitpack.io'
        }
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            switch (requested.id.id) {
                case 'com.replaymod.preprocess': {
                    // Served from the Conflux-Union fork of ReplayMod/preprocessor rather
                    // than com.github.ReplayMod directly: our tag v1.0.1 pins upstream
                    // commit 221276c7d4 plus a BFS root fix (tree root is now the lowest
                    // mcVersion instead of whichever node eachDir happens to yield first),
                    // so the 1.21.11 <-> 26.x mojangMappings variant links no longer break
                    // when CI runner readdir order puts a 26.x node first. Do not switch
                    // back to a Fallen-Breath-flavored build: maven.fallenbreth.me is dead,
                    // and its createNode maps parameter is typed non-null, which rejects
                    // the null namespace of the unobfuscated 26.x versions.
                    useModule "com.github.Conflux-Union:preprocessor:$requested.version"
                    break
                }
                case 'net.fabricmc.fabric-loom':
                case 'net.fabricmc.fabric-loom-remap': {
                    useModule "net.fabricmc:fabric-loom:${requested.version}"
                    break
                }
            }
        }
    }
}

file('versions').eachDir { dir ->
    final String version = ":$dir.name"
    include version
    final ProjectDescriptor projectDescriptor = project version
    projectDescriptor.projectDir = dir
    projectDescriptor.buildFileName = '../../common.gradle'
}
